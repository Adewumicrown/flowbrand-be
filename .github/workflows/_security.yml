name: _security

on:
  workflow_dispatch:
  workflow_call:

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}
          cache: npm

      - name: Install dependencies
        run: npm install --include=dev

      - name: Run npm audit
        run: npm audit --audit-level=high --omit=dev

  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog --version

      - name: Run TruffleHog (generate report)
        run: |
          trufflehog git --json --no-update file://. > trufflehog-report.json || true

      - name: Validate report is parseable JSON lines
        run: |
          if [ ! -s trufflehog-report.json ]; then
            echo "Report is empty — no findings."
            # Write a valid empty array so downstream steps always have parseable input
            echo "[]" > trufflehog-report.json
            exit 0
          fi
          # TruffleHog outputs one JSON object per line (NDJSON), not a JSON array.
          # Convert to a JSON array for uniform downstream handling.
          jq -s '.' trufflehog-report.json > trufflehog-report-array.json
          mv trufflehog-report-array.json trufflehog-report.json

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: trufflehog-report.json

      - name: Compare with baseline and fail on new findings
        run: |
          if [ ! -f .github/trufflehog-baseline.json ]; then
            echo "No baseline file found at .github/trufflehog-baseline.json — skipping diff, not failing."
            exit 0
          fi

          # Both files must be valid JSON arrays at this point.
          # Extract known fingerprints from baseline, then filter report to only unknown ones.
          jq -n \
            --slurpfile base .github/trufflehog-baseline.json \
            --slurpfile found trufflehog-report.json \
            '
              ($base[0] | map(.Fingerprint)) as $known |
              $found[0] | map(select(
                .Fingerprint as $f |
                $known | index($f) | not
              ))
            ' > trufflehog-new.json

          NEW_COUNT=$(jq 'length' trufflehog-new.json)
          echo "New findings count: $NEW_COUNT"

          if [ "$NEW_COUNT" -gt 0 ]; then
            echo "::error::TruffleHog detected $NEW_COUNT new secret(s) not present in the baseline."
            echo "New findings:"
            jq '.' trufflehog-new.json
            exit 1
          else
            echo "No new secrets found."
          fi
