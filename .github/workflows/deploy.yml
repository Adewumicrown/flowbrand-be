- name: Copy files to server
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" rsync -avz --delete \
            -e "ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no" \
            dist/ package.json yarn.lock .env \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/flowbrand-be/

      - name: Bootstrap server & start app
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh \
            -p ${{ secrets.SERVER_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'

            mkdir -p ~/flowbrand-be
            cd ~/flowbrand-be

            # Install Node 22 if not present
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt install -y nodejs
            fi

            # Install yarn if not present
            if ! command -v yarn &> /dev/null; then
              npm install -g yarn
            fi

            # Install PM2 if not present
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            # Install production dependencies
            yarn install --production --ignore-engines

            # Start or restart app
            if pm2 list | grep -q flowbrand-be; then
              pm2 restart flowbrand-be
            else
              pm2 start ~/flowbrand-be/dist/src/main.js --name flowbrand-be
              pm2 save
            fi
          EOF
